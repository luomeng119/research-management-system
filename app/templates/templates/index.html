{% extends "base.html" %}
{% include 'components/preview_panel.html' %}

{% block title %}科研模板 - 科研创新管理{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4">
        {% if current_cat %}
        <span class="text-primary">{{ current_cat }}</span>
        {% else %}
        科研模板
        {% endif %}
    </h2>
    
    <!-- 文档管理 - 可折叠 -->
    <div class="card mb-2">
        <div class="card-header" style="cursor:pointer" data-bs-toggle="collapse" data-bs-target="#collapseTemplates">
            <span><i class="bi bi-chevron-right me-2"></i> 模板目录</span>
        </div>
        <!-- 工具栏 -->
        <div class="card-header bg-light py-1 px-3 border-bottom">
            <button class="btn btn-outline-primary btn-sm me-2" onclick="showUploadFolderModal()">
                <i class="bi bi-folder-plus"></i> 上传文件夹
            </button>
        </div>
        <div id="collapseTemplates" class="collapse show">
            <div class="card-body">
                <div id="templateTree"></div>
            </div>
        </div>
    </div>
</div>

<!-- 新建文件夹弹窗 -->
<div class="modal" id="createFolderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新建文件夹</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="folderForm">
                    <input type="hidden" name="parent_folder" id="parentFolder" value="">
                    <div class="mb-3">
                        <label class="form-label">文件夹名称</label>
                        <input type="text" name="folder_name" class="form-control" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitCreateFolder()">创建</button>
            </div>
        </div>
    </div>
</div>

<!-- 上传文件夹弹窗 -->
<div class="modal" id="uploadFolderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">上传文件夹</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="folderUploadForm">
                    <div class="mb-3">
                        <label class="form-label">上传到分类</label>
                        <select name="target_folder" id="targetFolder" class="form-select">
                            <option value="">请选择分类</option>
                            {% for cat in ['财务模板', '会务模板', '公文模板', '方案模板', '其他模板'] %}
                            <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">选择文件夹</label>
                        <input type="file" id="folderInput" class="form-control" webkitdirectory multiple>
                        <small class="text-muted">支持选择整个文件夹，保持目录结构</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitUploadFolder()">上传</button>
            </div>
        </div>
    </div>
</div>

<script>
var folderData = {{ folder_tree|tojson|safe }};

function encodeLogicalPath(path) {
    return String(path).split('/').map(function(part) { return encodeURIComponent(part); }).join('/');
}

function renderTree(nodes, container) {
    container.replaceChildren();
    if (!nodes || nodes.length === 0) {
        var empty = document.createElement('p');
        empty.className = 'text-muted';
        empty.textContent = '暂无文件夹';
        container.appendChild(empty);
        return;
    }
    var list = document.createElement('ul');
    list.className = 'nav flex-column';
    nodes.forEach(function(node) { list.appendChild(buildNode(node)); });
    container.appendChild(list);
}

function buildNode(node) {
    var item = document.createElement('li');
    item.className = 'nav-item folder-node';
    item.dataset.path = node.path || '';
    var heading = document.createElement('div');
    heading.className = 'd-flex align-items-center mb-2';
    heading.style.paddingLeft = ((node.level || 0) * 20) + 'px';
    var body = document.createElement('div'); body.className = 'ms-4';
    var children = node.children || [];
    if (children.length) {
        var toggle = document.createElement('button');
        toggle.type = 'button'; toggle.className = 'btn btn-sm btn-link p-0 me-1'; toggle.textContent = '展开';
        body.hidden = true;
        toggle.addEventListener('click', function() { body.hidden = !body.hidden; toggle.textContent = body.hidden ? '展开' : '折叠'; });
        heading.appendChild(toggle);
    }
    var folder = document.createElement('button');
    folder.type = 'button'; folder.className = 'btn btn-link p-0 me-2'; folder.textContent = node.name;
    folder.addEventListener('click', function() { loadFolder(node.path); });
    heading.appendChild(folder);
    var count = document.createElement('span'); count.className = 'badge bg-secondary me-2'; count.textContent = String(node.fileCount || 0); heading.appendChild(count);
    var uploader = document.createElement('input'); uploader.type = 'file'; uploader.multiple = true; uploader.className = 'form-control form-control-sm me-2'; uploader.dataset.folder = node.path; uploader.addEventListener('change', function() { uploadFiles(uploader); }); heading.appendChild(uploader);
    var add = document.createElement('button'); add.type = 'button'; add.className = 'btn btn-outline-primary btn-sm me-1'; add.textContent = '新建子目录'; add.addEventListener('click', function() { showCreateFolder(node.path); }); heading.appendChild(add);
    var renameFolder = document.createElement('button'); renameFolder.type = 'button'; renameFolder.className = 'btn btn-outline-warning btn-sm me-1'; renameFolder.textContent = '重命名'; renameFolder.addEventListener('click', function() { var name = prompt('请输入文件夹名称:', node.name); if (name && name.trim() && name.trim() !== node.name) { var fd = new FormData(); fd.append('folder', node.path); fd.append('new_name', name.trim()); fetch('/templates/rename_folder', {method:'POST', body:fd}).then(function(r){ return r.json(); }).then(function(data){ if(data.success) location.reload(); else alert(data.message); }); } }); heading.appendChild(renameFolder);
    var archive = document.createElement('button'); archive.type = 'button'; archive.className = 'btn btn-outline-danger btn-sm'; archive.textContent = '归档'; archive.addEventListener('click', function() { if (confirm('确定归档此文件夹及其内容？')) { var fd = new FormData(); fd.append('folder', node.path); fetch('/templates/delete_folder', {method:'POST', body:fd}).then(function(r){return r.json();}).then(function(data){ if(data.success) location.reload(); else alert(data.message); }); } }); heading.appendChild(archive);
    item.appendChild(heading);
    (node.files || []).forEach(function(file) {
        var row = document.createElement('div'); row.className = 'd-flex align-items-center mb-1';
        var label = document.createElement('span'); label.className = 'me-2'; label.textContent = file.name; row.appendChild(label);
        var size = document.createElement('span'); size.className = 'text-muted me-2'; size.textContent = '(' + (file.size / 1024).toFixed(1) + ' KB)'; row.appendChild(size);
        var downloadUrl = '/templates/download/' + encodeLogicalPath(file.path);
        var preview = document.createElement('button'); preview.type = 'button'; preview.className = 'btn btn-outline-info btn-sm me-1'; preview.textContent = '预览'; preview.addEventListener('click', function() { openControlledPreview(file.fileId, file.versionNo, file.objectType, file.objectId, file.name, downloadUrl); }); row.appendChild(preview);
        var link = document.createElement('a'); link.className = 'btn btn-outline-primary btn-sm me-1'; link.href = downloadUrl; link.textContent = '下载'; row.appendChild(link);
        var rename = document.createElement('button'); rename.type = 'button'; rename.className = 'btn btn-outline-warning btn-sm me-1'; rename.textContent = '重命名'; rename.addEventListener('click', function(){ var value = prompt('请输入新文件名:', file.name); if (value && value.trim() && value.trim() !== file.name) { var fd = new FormData(); fd.append('filepath', file.path); fd.append('new_name', value.trim()); fetch('/templates/rename_file',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(data){if(data.success)location.reload();else alert(data.message);}); }}); row.appendChild(rename);
        var remove = document.createElement('button'); remove.type = 'button'; remove.className = 'btn btn-outline-danger btn-sm'; remove.textContent = '归档'; remove.addEventListener('click', function(){ if(confirm('确定归档此文件？')) { var fd = new FormData(); fd.append('filepath', file.path); fetch('/templates/delete_file',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(data){if(data.success)location.reload();else alert(data.message);}); }}); row.appendChild(remove);
        body.appendChild(row);
    });
    (node.children || []).forEach(function(child) { body.appendChild(buildNode(child)); });
    item.appendChild(body);
    return item;
}

// 点击文件夹加载该目录下的文件
function loadFolder(folderPath) {
    var url = '/templates/?cat=' + encodeURIComponent(folderPath);
    window.location.href = url;
}

// 显示新建文件夹弹窗
function showCreateFolder(parent) {
    document.getElementById('parentFolder').value = parent || '';
    document.getElementById('folderForm').reset();
    var modal = new bootstrap.Modal(document.getElementById('createFolderModal'));
    modal.show();
}

// 提交新建文件夹
function submitCreateFolder() {
    var fd = new FormData(document.getElementById('folderForm'));
    fetch('/templates/create_folder', {method:'POST', body:fd})
    .then(r=>r.json())
    .then(data=>{
        if (data.success) {
            location.reload();
        } else {
            alert(data.message);
        }
    });
}

// 显示上传文件夹弹窗
function showUploadFolderModal() {
    var modal = new bootstrap.Modal(document.getElementById('uploadFolderModal'));
    modal.show();
}

// 提交文件夹上传
function submitUploadFolder() {
    var folder = document.getElementById('targetFolder').value;
    var input = document.getElementById('folderInput');
    var files = input.files;
    
    if (!folder) {
        alert('请选择上传到的分类');
        return;
    }
    if (files.length === 0) {
        alert('请选择文件夹');
        return;
    }
    
    var fd = new FormData();
    fd.append('folder', folder);
    
    // 添加所有文件（包括目录结构信息）
    Array.from(files).forEach(function(file) {
        fd.append('files', file, file.webkitRelativePath || file.name);
    });
    
    fetch('/templates/upload_folder', {method:'POST', body:fd})
    .then(r=>r.json())
    .then(data=>{
        if (data.success) {
            location.reload();
        } else {
            alert(data.message);
        }
    });
}

// 上传文件
function uploadFiles(input) {
    var files = input.files;
    var folder = input.getAttribute('data-folder');
    if (files.length === 0) return;
    
    var fd = new FormData();
    fd.append('folder', folder);
    
    Array.from(files).forEach(function(file) {
        fd.append('file', file);
    });
    
    fetch('/templates/upload', {method:'POST', body:fd})
    .then(r=>r.json())
    .then(data=>{
        if (data.success) {
            location.reload();
        } else {
            alert(data.message);
        }
    });
}

// 页面加载完成后渲染目录树
document.addEventListener('DOMContentLoaded', function() {
    renderTree(folderData, document.getElementById('templateTree'));
    
    // 折叠图标旋转
    document.querySelectorAll('.collapse').forEach(function(elem) {
        elem.addEventListener('show.bs.collapse', function() {
            var header = this.previousElementSibling;
            if (header && header.querySelector('.bi-chevron-right')) {
                header.querySelector('.bi-chevron-right').classList.replace('bi-chevron-right', 'bi-chevron-down');
            }
        });
        elem.addEventListener('hide.bs.collapse', function() {
            var header = this.previousElementSibling;
            if (header && header.querySelector('.bi-chevron-down')) {
                header.querySelector('.bi-chevron-down').classList.replace('bi-chevron-down', 'bi-chevron-right');
            }
        });
    });
});
</script>
{% endblock %}
