{% extends "base.html" %}

{% block title %}登录 - 科研管理系统{% endblock %}

{% block login_content %}
<style>
.login-bg {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}
.login-bg::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
        radial-gradient(ellipse at 20% 80%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 100, 255, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(128, 0, 255, 0.05) 0%, transparent 70%);
    animation: pulse 8s ease-in-out infinite;
}
.login-bg::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
        linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
@keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }
.login-container { position: relative; z-index: 1; padding-top: 80px; }
.login-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 255, 255, 0.2);
    border-radius: 15px;
}
.login-title {
    font-size: 1.8rem;
    color: #fff;
    text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
}
.form-label { color: #ccc; }
.form-control {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(0, 255, 255, 0.3);
    color: #fff;
}
.form-control:focus {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(0, 255, 255, 0.6);
    color: #fff;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
}
.form-control::placeholder { color: rgba(255, 255, 255, 0.5); }
.login-btn {
    background: linear-gradient(90deg, #00ffff, #0088ff);
    border: none;
    color: #000;
    font-weight: bold;
}
.login-btn:hover {
    background: linear-gradient(90deg, #00cccc, #0066cc);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
}
.register-link { color: #00ffff; }
.register-link:hover { color: #66ffff; text-decoration: none; }
</style>
<div class="login-bg">
    <div class="container login-container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card login-card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 login-title">科研管理系统</h3>
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">用户名</label>
                                <input type="text" name="username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">密码</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn login-btn w-100">登录</button>
                        </form>
                        <div class="mt-3 text-center">
                            <small>没有账号？<a href="{{ url_for('auth.register') }}" class="register-link">立即注册</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
