{% extends "base.html" %}

{% block title %}新建项目{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>新建项目</h2>
        <a href="{{ return_url|default('/projects') }}" class="btn btn-outline-secondary">返回</a>
    </div>
    
    <form method="POST" class="card" style="max-width: 600px;">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">项目编号（建议格式：PRJYYYYMMNNN）</label>
                <input type="text" name="project_id" class="form-control" value="{{ default_project_id }}" placeholder="留空自动生成">
            </div>
            <div class="mb-3">
                <label class="form-label">项目名称 *</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">负责人 *</label>
                <input type="text" name="leader" class="form-control" value="{{ default_leader|default(current_user) }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">开始日期 *</label>
                <input type="date" name="start_date" class="form-control" value="{{ today }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">计划结束日期</label>
                <input type="date" name="planned_end_date" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">任务号</label>
                <input type="text" name="task_number" class="form-control" placeholder="选填">
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">创建项目</button>
        </div>
    </form>
</div>
{% endblock %}
