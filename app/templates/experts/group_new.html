{% extends "base.html" %}

{% block title %}新建专家组{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>新建专家组</h2>
        <a href="{{ url_for('expert_groups.index') }}" class="btn btn-outline-secondary">返回</a>
    </div>
    
    <form method="POST" class="card" style="max-width: 600px;">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">会议名称</label>
                <input type="text" name="meeting_name" class="form-control" placeholder="留空则使用默认名称">
                <div class="form-text">留空将自动生成为"2026-xx-xx会议"格式</div>
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">创建并添加成员</button>
        </div>
    </form>
</div>
{% endblock %}
