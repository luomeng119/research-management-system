{% extends "base.html" %}

{% block title %}新建专家组{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>新建专家组</h2>
        <a href="{{ url_for('expert_groups.index') }}" class="btn btn-outline-secondary">返回</a>
    </div>
    
    <form method="POST" class="card" style="max-width: 600px;">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">专家组名称</label>
                <input type="text" name="group_name" class="form-control" placeholder="如：材料与制造专家组">
                <div class="form-text">用于保存可复用的专家名单，不代表会议或评审流程。</div>
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">创建并添加成员</button>
        </div>
    </form>
</div>
{% endblock %}
