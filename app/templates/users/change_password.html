{% extends "base.html" %}

{% block title %}修改密码 - 科研创新管理{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>修改密码</h2>
        <a href="/" class="btn btn-outline-secondary">返回首页</a>
    </div>
    
    <form method="POST" class="card" style="max-width: 500px;">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">原密码</label>
                <input type="password" name="old_password" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">新密码</label>
                <input type="password" name="new_password" class="form-control" required minlength="12" placeholder="至少12位，同时包含字母和数字">
            </div>
            <div class="mb-3">
                <label class="form-label">确认新密码</label>
                <input type="password" name="confirm_password" class="form-control" required minlength="12" placeholder="再输入一次">
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">修改密码</button>
        </div>
    </form>
</div>
{% endblock %}
